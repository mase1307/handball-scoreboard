<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Scoreboard Control</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #111;
  color: white;
  text-align: center;
}

button {
  font-size: 22px;
  padding: 15px 25px;
  margin: 10px;
}

input {
  font-size: 20px;
  padding: 5px;
  width: 140px;
  text-align: center;
}
</style>
</head>

<body>

<h2>Teamnamen</h2>
<input id="home" placeholder="Heim">
<input id="away" placeholder="Gast">
<br>
<button onclick="save()">Namen speichern</button>

<h2>Score</h2>
<button onclick="add('scoreHome', 1)">+ Heim</button>
<button onclick="add('scoreHome', -1)">- Heim</button>
<br>
<button onclick="add('scoreAway', 1)">+ Gast</button>
<button onclick="add('scoreAway', -1)">- Gast</button>

<h2>Uhr (MM:SS)</h2>
<div id="clock">00:00</div>
<button onclick="start()">Start</button>
<button onclick="stop()">Stop</button>
<button onclick="reset()">Reset</button>

<script>
const SHEET_API = "https://script.google.com/macros/s/AKfycbxPLACEHOLDER/exec";

let time = 0;
let interval = null;

function updateClock() {
  const m = String(Math.floor(time / 60)).padStart(2, "0");
  const s = String(time % 60).padStart(2, "0");
  document.getElementById("clock").innerText = `${m}:${s}`;
  send({ time: `${m}:${s}` });
}

function start() {
  if (!interval) interval = setInterval(() => {
    time++;
    updateClock();
  }, 1000);
}

function stop() {
  clearInterval(interval);
  interval = null;
}

function reset() {
  time = 0;
  updateClock();
}

function add(field, value) {
  send({ field, value });
}

function save() {
  send({
    home: document.getElementById("home").value,
    away: document.getElementById("away").value
  });
}

function send(data) {
  fetch(SHEET_API, {
    method: "POST",
    body: JSON.stringify(data)
  });
}
</script>

</body>
</html>
