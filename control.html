<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Handball Control</title>
<style>
body {
  background:#111;
  color:white;
  font-family:Arial, sans-serif;
  text-align:center;
}
button {
  width:90%;
  font-size:32px;
  padding:20px;
  margin:10px 0;
  border:none;
  border-radius:10px;
}
.heim { background:#c00000; }
.gast { background:#000000; }
.start { background:#2ecc71; }
.stop { background:#e74c3c; }
.reset { background:#555; }
</style>
</head>
<body>

<h1>SPIELSTEUERUNG</h1>

<button class="heim" onclick="goal(1)">TOR HEIM +</button>
<button class="gast" onclick="goal(2)">TOR GAST +</button>

<button class="start" onclick="run(1)">▶ UHR START</button>
<button class="stop" onclick="run(0)">⏸ UHR STOP</button>

<button class="reset" onclick="resetGame()">↺ RESET</button>

<script>
const SCRIPT_URL = "https://docs.google.com/spreadsheets/d/1qm2SLfdhCxYwzCgZGfjbnjsjZJSA12vql4iakCvCaTI/edit?usp=sharing";

function goal(team){
  fetch(`${SCRIPT_URL}?action=goal&team=${team}`);
}
function run(v){
  fetch(`${SCRIPT_URL}?action=run&value=${v}`);
}
function resetGame(){
  if(confirm("Spiel wirklich zurücksetzen?")){
    fetch(`${SCRIPT_URL}?action=reset`);
  }
}
</script>

</body>
</html>
