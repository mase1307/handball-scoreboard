<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Handball Scoreboard</title>

<style>
body {
  margin: 0;
  background: transparent;
  font-family: Arial, sans-serif;
  color: white;
}

#scoreboard {
  position: absolute;
  top: 40px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.75);
  padding: 20px 40px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  gap: 28px;
}

.team {
  min-width: 180px;
  text-align: center;
  font-size: 28px;
}

.score {
  font-size: 52px;
  font-weight: bold;
}

#timer {
  font-size: 40px;
  font-weight: bold;
}
</style>
</head>

<body>

<div id="scoreboard">
  <div class="team" id="home">HEIM</div>
  <div class="score" id="scoreHome">0</div>
  <div id="timer">00:00</div>
  <div class="score" id="scoreAway">0</div>
  <div class="team" id="away">GAST</div>
</div>

<script>
const SHEET_URL =
"https://opensheet.elk.sh/1qm2SLfdhCxYwzCgZGfjbnjsjZJSA12vql4iakCvCaTI/Sheet1";

async function loadData() {
  const res = await fetch(SHEET_URL);
  const data = await res.json();
  const row = data[0];

  document.getElementById("home").innerText = row.home;
  document.getElementById("away").innerText = row.away;
  document.getElementById("scoreHome").innerText = row.scoreHome;
  document.getElementById("scoreAway").innerText = row.scoreAway;
  document.getElementById("timer").innerText = row.time;
}

loadData();
setInterval(loadData, 1000);
</script>

</body>
</html>
